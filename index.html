<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geetesh Kankonkar — Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Geetesh Kankonkar, a Designer & frontend developer based in Goa, India, building immersive, motion-driven web interfaces."
    />
    <link rel="canonical" href="https://geetesh.work/" />
    <meta name="theme-color" content="#000000" />

    <!--
      GitHub Pages serves static files only — it can't send custom HTTP
      response headers, so a meta tag is the only way to set a CSP here.
      Note the meta-tag form of CSP silently ignores `frame-ancestors`
      (and there's no meta equivalent for X-Frame-Options or
      Permissions-Policy at all) — browsers only honor those as real HTTP
      headers, e.g. via a proxy like Cloudflare in front of Pages.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        media-src 'self' https://res.cloudinary.com;
        connect-src 'self' ws: wss: blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://geetesh.work/" />
    <meta property="og:title" content="Geetesh Kankonkar — Portfolio" />
    <meta
      property="og:description"
      content="Portfolio of Geetesh Kankonkar, a Designer & developer based in Goa, India, building immersive, motion-driven web interfaces."
    />
    <meta property="og:image" content="https://geetesh.work/images/zen-scroller.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Geetesh Kankonkar — Frontend Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Geetesh Kankonkar, a  designer & frontend developer based in Goa, India, building immersive, motion-driven web interfaces."
    />
    <meta name="twitter:image" content="https://geetesh.work/images/zen-scroller.png" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
